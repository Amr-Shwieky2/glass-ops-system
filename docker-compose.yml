# Self-hosted stack (ARCHITECTURE.md section 9): Postgres + the Next.js app,
# on a machine the company controls. No account, no card, no usage cap.
#
# Credentials come from a `.env.docker` file next to this one (not
# committed — see .gitignore's `.env*` rule; template: .env.docker.example)
# via Compose's own ${VAR} interpolation. Required variables: POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB. Deliberately NOT named `.env` — this
# project's local dev server also reads a root-level `.env`, which is
# Compose's own default lookup name too; every `docker compose` command
# against this file must pass `--env-file .env.docker` explicitly so the
# two never collide (see DEPLOYMENT.md section 1 and .env.docker.example).
#
# This stack is entirely separate from this machine's native (non-Docker)
# Postgres used for local dev — different container, different named
# volume, and its own credentials; nothing here reads or writes that
# database.
#
# `scheduler` (Sprint 4): the worker container ARCHITECTURE.md section 9
# names. It builds from the exact same Dockerfile/context as `app` (so
# Docker's layer cache makes its build effectively free — no new image, no
# new dependency), then overrides the entrypoint with a trivial polling
# loop that calls the already-running `app` service's own internal
# endpoint (POST /api/internal/scheduler, src/app/api/internal/scheduler/
# route.ts) on a fixed interval. All the real logic (querying for due
# reminders, claiming them exactly once via scheduled_reminders' unique
# constraint, sending notifications) runs inside `app`'s own already-
# built, already-traced server process — `scheduler` itself needs nothing
# beyond `curl`, which the image already installs for its own HEALTHCHECK.
# No paid service, no separate build stage.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no top-level `ports:` mapping — only the app service
    # needs to reach Postgres, over the compose-internal network by service
    # name, which needs no host port exposure at all in a real deployment.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      SCHEDULER_SECRET: ${SCHEDULER_SECRET}
    ports:
      # Host 3001 -> container 3000: the native dev server already owns
      # host port 3000 on this machine, so the containerized app is
      # published on 3001 instead.
      - "3001:3000"
    volumes:
      # Measurement attachments (New Measurement quick-submit flow,
      # src/server/storage/attachments.ts) are written outside `public/`
      # to `storage/measurement-attachments` under the app's WORKDIR
      # (/app, per the Dockerfile) — a named volume here so uploads
      # survive a container rebuild, matching how postgres_data already
      # persists Postgres's own data.
      - measurement_attachments:/app/storage
    # No `healthcheck:` override here — the Dockerfile's own HEALTHCHECK
    # instruction (curl against /login) is baked into this image and
    # already satisfies `scheduler`'s `condition: service_healthy` below.

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SCHEDULER_SECRET: ${SCHEDULER_SECRET}
      # How often to sweep for due reminders. 5 minutes is frequent enough
      # that the tightest configurable threshold (measurementReminder
      # MinutesBefore, default 60) still fires with several minutes of
      # margin, without hammering the app; every condition is idempotent
      # either way (scheduled_reminders' unique constraint), so a shorter
      # or longer interval is safe to tune without any code change.
      SCHEDULER_INTERVAL_SECONDS: 300
    # Deliberately not the image's own ENTRYPOINT (migrate-then-serve) —
    # this service is not a second app server, just a polling loop against
    # the real one. `sh -c` is a full override, not an argument to it.
    entrypoint: ["/bin/sh", "-c"]
    # `$$VAR` (not `$VAR`): Compose interpolates single-`$` references in
    # this file itself against the HOST's/`.env.docker`'s variables before
    # the container ever starts — doubling the `$` escapes that pass, so
    # the literal `$VAR` reaches `/bin/sh` inside the container, which
    # expands it from ITS OWN environment (the `environment:` block above).
    # Without this escaping, SCHEDULER_INTERVAL_SECONDS (not set on the
    # host at all) would silently interpolate to an empty string here.
    command:
      - |
        set -eu
        echo "Scheduler worker started, polling app every $${SCHEDULER_INTERVAL_SECONDS}s..."
        while true; do
          curl -fsS -X POST \
            -H "x-scheduler-secret: $${SCHEDULER_SECRET}" \
            "http://app:3000/api/internal/scheduler" \
            || echo "[scheduler] sweep request failed (will retry next tick)"
          sleep "$${SCHEDULER_INTERVAL_SECONDS}"
        done

volumes:
  postgres_data:
  measurement_attachments:
